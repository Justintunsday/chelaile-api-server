name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test tests/unit
      - run: bun run test:contract
      - name: Ensure contract snapshots were not generated or modified
        run: |
          git diff --exit-code -- tests/contracts
          test -z "$(git ls-files --others --exclude-standard tests/contracts)"
      - run: bun run check:worker
      - run: bun run build:worker
      - run: bun run test:worker
      - run: bun run test:runtime
      - name: Verify Bun compiled entrypoints
        run: bun test ./tests/runtime/node-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-server
          path: dist/
          retention-days: 7

  node-runtime:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compiled-server
          path: dist/
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm run test:runtime

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t chelaile-ci .
      - name: Verify container health and bundled city data
        run: |
          docker run -d --name chelaile-ci -p 127.0.0.1:8787:8787 chelaile-ci
          trap 'docker logs chelaile-ci; docker rm -f chelaile-ci' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/v1/health
          curl --fail 'http://127.0.0.1:8787/v1/cities?hot_only=false' | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["origin"]=="file"; assert any(c["cityId"]=="034" for c in data["cities"])'
